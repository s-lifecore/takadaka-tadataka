services:
  firebase-emulator:
    build:
      context: .
      dockerfile: docker/firebase-emulator.Dockerfile
    working_dir: /workspace
    env_file:
      - ${ENV_FILE:-.env.prev.local}
      - ${FUNCTIONS_ENV_FILE:-functions/.env.prev.local}
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
    volumes:
      - .:/workspace
      - functions_node_modules:/workspace/functions/node_modules
    ports:
      - "4000:4000"
      - "4400:4400"
      - "5001:5001"
      - "8080:8080"
      - "9150:9150"
    command: >-
      sh -c "npm ci --prefix functions &&
      npm run build --prefix functions -- --watch &
      exec firebase emulators:start --only functions,firestore
      --project \"$${FIREBASE_PROJECT_ID}\" --host 0.0.0.0"

  frontend:
    image: node:24.22.2-bookworm-slim
    working_dir: /workspace
    env_file:
      - ${ENV_FILE:-.env.prev.local}
    environment:
      VITE_API_BASE_URL: http://localhost:5001/${FIREBASE_PROJECT_ID}/asia-northeast1/api
      VITE_MODE: ${VITE_MODE:-prev}
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - firebase-emulator
    command: >-
      sh -c "npm ci && npm run dev -- --host 0.0.0.0 --mode $${VITE_MODE:-prev}"

volumes:
  frontend_node_modules:
  functions_node_modules:
