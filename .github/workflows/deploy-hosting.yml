name: Deploy Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hosting-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Build
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}

      - name: Build Functions
        run: npm run build --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set Functions secrets
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          test -n "$CLERK_SECRET_KEY"
          test -n "$CLOUDINARY_CLOUD_NAME"
          test -n "$CLOUDINARY_API_KEY"
          test -n "$CLOUDINARY_API_SECRET"
          test -n "$CLOUDINARY_UPLOAD_PRESET"
          test -n "$GROQ_API_KEY"
          printf '%s' "$CLERK_SECRET_KEY" | npx --yes firebase-tools@15.34.2 functions:secrets:set CLERK_SECRET_KEY --data-file=- --project "$FIREBASE_PROJECT_ID"
          printf '%s' "$CLOUDINARY_CLOUD_NAME" | npx --yes firebase-tools@15.34.2 functions:secrets:set CLOUDINARY_CLOUD_NAME --data-file=- --project "$FIREBASE_PROJECT_ID"
          printf '%s' "$CLOUDINARY_API_KEY" | npx --yes firebase-tools@15.34.2 functions:secrets:set CLOUDINARY_API_KEY --data-file=- --project "$FIREBASE_PROJECT_ID"
          printf '%s' "$CLOUDINARY_API_SECRET" | npx --yes firebase-tools@15.34.2 functions:secrets:set CLOUDINARY_API_SECRET --data-file=- --project "$FIREBASE_PROJECT_ID"
          printf '%s' "$CLOUDINARY_UPLOAD_PRESET" | npx --yes firebase-tools@15.34.2 functions:secrets:set CLOUDINARY_UPLOAD_PRESET --data-file=- --project "$FIREBASE_PROJECT_ID"
          printf '%s' "$GROQ_API_KEY" | npx --yes firebase-tools@15.34.2 functions:secrets:set GROQ_API_KEY --data-file=- --project "$FIREBASE_PROJECT_ID"

      - name: Configure Functions artifact cleanup
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools@15.34.2 functions:artifacts:setpolicy --location asia-northeast1 --days 1 --project "$FIREBASE_PROJECT_ID"

      - name: Deploy Functions
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools@15.34.2 deploy --only functions --project "$FIREBASE_PROJECT_ID"

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
